slice_name: 24h Temperature Trend
description: Hourly temperature evolution for each monitored city
viz_type: echarts_timeseries_line
params:
  datasource: 0__table
  viz_type: echarts_timeseries_line
  x_axis: weather_time_local
  time_grain_sqla: PT1H
  time_range: Last day
  metrics:
    - expressionType: SIMPLE
      column:
        column_name: temperature
        type: DOUBLE PRECISION
      aggregate: AVG
      label: Temperature °C
      optionName: metric_temperature_trend
  groupby:
    - city
  adhoc_filters: []
  row_limit: 10000
  truncate_metric: true
  show_legend: true
  legendType: scroll
  legendOrientation: top
  x_axis_time_format: smart_date
  y_axis_format: .1f
  y_axis_title: Temperature (°C)
  show_value: false
  stack: null
  markerEnabled: false
  rich_tooltip: true
  tooltipTimeFormat: smart_date
