name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Python tests ────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install requests psycopg2-binary python-dotenv pytest pytest-cov

      - name: Run tests with coverage
        run: pytest tests/ -v --tb=short --cov=scripts --cov-report=term-missing

  # ── Syntax / style check ────────────────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install flake8
        run: pip install flake8

      - name: Check Python syntax (scripts)
        run: flake8 scripts/ --max-line-length=100 --extend-ignore=E501,W503

      - name: Check Python syntax (tests)
        run: flake8 tests/ --max-line-length=100 --extend-ignore=E501,W503

  # ── dbt syntax check ────────────────────────────────────────────────────────
  dbt-parse:
    name: dbt Parse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate dbt YAML files
        run: |
          pip install pyyaml
          python -c "
          import yaml, glob, sys
          errors = []
          for f in glob.glob('dbt/**/*.yml', recursive=True):
              try:
                  yaml.safe_load(open(f))
              except yaml.YAMLError as e:
                  errors.append(f'{f}: {e}')
          if errors:
              print('YAML errors:', errors)
              sys.exit(1)
          print('All dbt YAML files are valid')
          "
